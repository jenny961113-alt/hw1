<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#111817">
    <title>霓虹撞擊｜3D 打磚塊</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700;800;900&family=DM+Sans:wght@400;500;600;700;800&display=swap');
        :root {
            color-scheme: dark;
            --ink: #111817;
            --panel: #1a2420;
            --line: #35413a;
            --paper: #f2f2df;
            --muted: #a0afa2;
            --lime: #d6ff48;
            --coral: #ff705c;
            --cyan: #52e6dc;
            --pink: #ff62ae;
            --yellow: #ffd34e;
        }
        * { box-sizing: border-box; }
        body {
            margin: 0;
            min-height: 100vh;
            color: var(--paper);
            background-color: var(--ink);
            background-image: linear-gradient(#ffffff06 1px, transparent 1px), linear-gradient(90deg, #ffffff06 1px, transparent 1px), radial-gradient(ellipse at 50% -15%, #49352a 0, transparent 52%);
            background-size: 32px 32px, 32px 32px, auto;
            font-family: 'DM Sans', 'Microsoft JhengHei', sans-serif;
        }
        button { font: inherit; }
        .page { width: min(1120px, calc(100% - 48px)); margin: 0 auto; padding: 24px 0 22px; }
        .masthead { display: flex; justify-content: space-between; align-items: end; gap: 20px; margin-bottom: 18px; }
        .eyebrow { display: flex; align-items: center; gap: 9px; color: var(--lime); font-size: 11px; font-weight: 800; letter-spacing: 1.8px; text-transform: uppercase; }
        .eyebrow::before { width: 8px; height: 8px; content: ''; background: var(--lime); transform: rotate(45deg); box-shadow: 0 0 12px #d6ff4880; }
        h1 { margin: 5px 0 0; font-family: 'Barlow Condensed', Impact, sans-serif; font-size: clamp(34px, 5vw, 54px); line-height: .95; letter-spacing: 0; font-weight: 900; text-transform: uppercase; }
        h1 span { color: var(--coral); }
        .tagline { margin: 8px 0 0; color: var(--muted); font-size: 13px; }
        .actions { display: flex; gap: 8px; }
        .icon-button { display: inline-flex; align-items: center; justify-content: center; gap: 8px; min-height: 40px; padding: 0 13px; border: 1px solid #647066; border-radius: 4px; color: var(--paper); background: #1d2722; cursor: pointer; transition: border-color .18s, background .18s, transform .18s; }
        .icon-button:hover { border-color: var(--lime); background: #29342c; transform: translateY(-1px); }
        .icon-button svg { width: 16px; height: 16px; fill: none; stroke: currentColor; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }
        .scorebar { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)) auto; min-height: 66px; align-items: center; margin-bottom: 10px; border: 1px solid var(--line); border-radius: 5px; background: #1a2420eF; }
        .stat { padding: 0 18px; border-right: 1px solid var(--line); }
        .stat-label { color: var(--muted); font-size: 10px; font-weight: 800; letter-spacing: 1.3px; text-transform: uppercase; }
        .stat-value { margin-top: 2px; color: var(--paper); font-family: 'Barlow Condensed', Impact, sans-serif; font-size: 25px; font-weight: 800; line-height: 1; }
        #score { color: var(--lime); }
        #lives { color: var(--coral); letter-spacing: 2px; font-size: 18px; }
        .game-state { padding: 0 18px; color: var(--cyan); font-size: 11px; font-weight: 800; letter-spacing: 1px; white-space: nowrap; }
        .game-frame { position: relative; overflow: hidden; border: 1px solid #77857a; border-radius: 5px; background: #172321; box-shadow: 0 14px 54px #0008, inset 0 0 0 5px #111817; }
        .game-frame::after { position: absolute; z-index: 1; inset: 0; border: 5px solid #111817; border-radius: 4px; content: ''; pointer-events: none; }
        #game { display: block; width: 100%; aspect-ratio: 16 / 10; touch-action: none; }
        .overlay { position: absolute; z-index: 2; inset: 5px; display: grid; place-items: center; padding: 22px; background: #101916bd; backdrop-filter: blur(5px); text-align: center; }
        .overlay[hidden] { display: none; }
        .dialog { width: min(390px, 100%); padding: 28px 26px 24px; border: 1px solid #71816e; border-top: 4px solid var(--lime); border-radius: 5px; background: #1a2420f5; box-shadow: 0 15px 60px #0009; animation: arrive .35s ease-out both; }
        @keyframes arrive { from { opacity: 0; transform: translateY(12px) scale(.98); } to { opacity: 1; transform: translateY(0) scale(1); } }
        .dialog h2 { margin: 0; color: var(--lime); font-family: 'Barlow Condensed', Impact, sans-serif; font-size: 42px; font-weight: 900; line-height: 1; }
        .dialog p { margin: 13px 0 20px; color: #c2d0c1; font-size: 14px; line-height: 1.65; }
        .primary-button { display: inline-flex; align-items: center; justify-content: center; gap: 10px; min-height: 46px; padding: 0 22px; border: 0; border-radius: 3px; color: #162017; background: var(--lime); font-size: 13px; font-weight: 900; cursor: pointer; transition: background .18s, transform .18s; }
        .primary-button:hover { background: #e4ff85; transform: translateY(-2px); }
        .primary-button svg { width: 17px; height: 17px; fill: currentColor; stroke: none; }
        .toolbar { display: flex; justify-content: space-between; align-items: center; gap: 12px; padding: 12px 2px 0; }
        .help { display: flex; flex-wrap: wrap; gap: 7px 16px; color: #b8c4b7; font-size: 11px; }
        .help strong { color: var(--paper); font-weight: 700; }
        .key { display: inline-flex; min-width: 20px; height: 20px; justify-content: center; align-items: center; padding: 0 5px; border: 1px solid #647066; border-bottom-width: 2px; border-radius: 3px; color: var(--paper); font-size: 10px; font-weight: 800; }
        .touch-controls { display: none; gap: 7px; }
        .touch-button { width: 42px; height: 38px; border: 1px solid #58685b; border-radius: 4px; color: var(--paper); background: #1d2722; font-size: 15px; font-weight: 800; touch-action: none; }
        .touch-button.launch { width: auto; padding: 0 12px; color: #162017; border-color: var(--lime); background: var(--lime); font-size: 11px; }
        .footer { display: flex; justify-content: space-between; margin-top: 15px; color: #849187; font-size: 10px; letter-spacing: .5px; }
        .footer b { color: var(--cyan); font-weight: 700; }
        @media (max-width: 650px) {
            .page { width: calc(100% - 24px); padding-top: 18px; }
            .masthead { align-items: start; margin-bottom: 13px; }
            .tagline { max-width: 220px; font-size: 11px; }
            .actions { gap: 5px; }
            .icon-button { width: 38px; min-width: 38px; height: 38px; padding: 0; }
            .icon-button .button-label { display: none; }
            .scorebar { min-height: 57px; grid-template-columns: repeat(4, minmax(0, 1fr)); }
            .stat { padding: 0 9px; }
            .stat-label { font-size: 8px; letter-spacing: .8px; }
            .stat-value { font-size: 21px; }
            #lives { font-size: 15px; letter-spacing: 0; }
            .game-state { display: none; }
            #game { aspect-ratio: 4 / 3; }
            .overlay { padding: 12px; }
            .dialog { padding: 22px 17px 19px; }
            .dialog h2 { font-size: 36px; }
            .dialog p { margin: 10px 0 15px; font-size: 12px; }
            .toolbar { padding-top: 9px; }
            .help { display: none; }
            .touch-controls { display: flex; }
            .footer { font-size: 9px; }
        }
        @media (prefers-reduced-motion: reduce) { *, *::before, *::after { animation-duration: .01ms !important; transition-duration: .01ms !important; } }
    </style>
</head>
<body>
    <main class="page">
        <header class="masthead">
            <div>
                <div class="eyebrow">A7 ARCADE · 3D GAME</div>
                <h1>霓虹<span>撞擊</span></h1>
                <p class="tagline">瞄準、反彈、清空整片霓虹磚牆。</p>
            </div>
            <div class="actions">
                <button class="icon-button" id="pause" type="button" aria-label="暫停" title="暫停遊戲">
                    <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M9 5v14M15 5v14"/></svg><span class="button-label">暫停</span>
                </button>
                <button class="icon-button" id="restart" type="button" aria-label="重新開始" title="重新開始">
                    <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M20 7v5h-5M4.8 9a7.5 7.5 0 0 1 12.6-2L20 12M4 17v-5h5m10.2 3a7.5 7.5 0 0 1-12.6 2L4 12"/></svg><span class="button-label">重開</span>
                </button>
                <button class="icon-button" id="sound" type="button" aria-label="切換音效" title="切換音效">
                    <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M11 5 6 9H3v6h3l5 4zM15.5 8.5a5 5 0 0 1 0 7M18.5 5.5a9 9 0 0 1 0 13"/></svg><span class="button-label">音效</span>
                </button>
            </div>
        </header>
        <section class="scorebar" aria-label="遊戲資訊">
            <div class="stat"><div class="stat-label">分數 / SCORE</div><div class="stat-value" id="score">0000</div></div>
            <div class="stat"><div class="stat-label">最高 / BEST</div><div class="stat-value" id="best">0000</div></div>
            <div class="stat"><div class="stat-label">關卡 / LEVEL</div><div class="stat-value" id="level">01</div></div>
            <div class="stat"><div class="stat-label">生命 / LIVES</div><div class="stat-value" id="lives">● ● ●</div></div>
            <div class="game-state" id="state">準備就緒</div>
        </section>
        <section class="game-frame" aria-label="打磚塊遊戲場地">
            <canvas id="game" aria-label="3D 打磚塊遊戲畫面"></canvas>
            <div class="overlay" id="overlay">
                <div class="dialog">
                    <h2 id="overlay-title">準備開打？</h2>
                    <p id="overlay-copy">移動球拍接住小球，把每一塊霓虹磚都打下來。別讓球掉出場外！</p>
                    <button class="primary-button" id="start" type="button"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M8 5v14l11-7z"/></svg><span>開始遊戲</span></button>
                </div>
            </div>
        </section>
        <div class="toolbar">
            <div class="help"><span><span class="key">←</span> <span class="key">→</span> 或 <strong>A</strong> <strong>D</strong> 移動</span><span><span class="key">Space</span> 發球 / 暫停</span><span><strong>滑鼠拖曳</strong> 移動球拍</span></div>
            <div class="touch-controls" aria-label="觸控遊戲控制">
                <button class="touch-button" id="left" type="button" aria-label="向左移動">←</button>
                <button class="touch-button launch" id="launch" type="button">發球</button>
                <button class="touch-button" id="right" type="button" aria-label="向右移動">→</button>
            </div>
        </div>
        <footer class="footer"><span>ONE BALL. ONE MORE ROUND.</span><span>MOVE FAST · <b>BREAK EVERYTHING</b></span></footer>
    </main>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script>
        (() => {
            const canvas = document.querySelector('#game');
            const renderer = new THREE.WebGLRenderer({ canvas, antialias: true, alpha: false });
            renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, 2));
            renderer.setClearColor(0x172321);
            renderer.shadowMap.enabled = true;
            renderer.shadowMap.type = THREE.PCFSoftShadowMap;
            renderer.outputEncoding = THREE.sRGBEncoding;
            const scene = new THREE.Scene();
            scene.fog = new THREE.Fog(0x172321, 24, 42);
            const camera = new THREE.OrthographicCamera(-8.6, 8.6, 5.375, -5.375, 0.1, 80);
            camera.position.set(0, 0, 28);
            camera.lookAt(0, 0, 0);
            const ambient = new THREE.HemisphereLight(0xc6fff1, 0x241a2b, 1.65);
            scene.add(ambient);
            const keyLight = new THREE.DirectionalLight(0xffffff, 2.2);
            keyLight.position.set(-5, 7, 13);
            keyLight.castShadow = true;
            keyLight.shadow.mapSize.set(1024, 1024);
            scene.add(keyLight);
            const fillLight = new THREE.PointLight(0x50eee0, 34, 23);
            fillLight.position.set(6, -1, 7);
            scene.add(fillLight);

            const boardWidth = 16, leftWall = -7.7, rightWall = 7.7, topWall = 5.05, bottomEdge = -5.2;
            const bricks = [], particles = [], stars = [], keys = {};
            const scoreEl = document.querySelector('#score'), bestEl = document.querySelector('#best');
            const livesEl = document.querySelector('#lives'), levelEl = document.querySelector('#level');
            const overlay = document.querySelector('#overlay'), stateEl = document.querySelector('#state');
            const startButton = document.querySelector('#start'), pauseButton = document.querySelector('#pause');
            let score = 0, lives = 3, level = 1, best = Number(localStorage.getItem('a7-breaker-best') || 0);
            let running = false, paused = false, launched = false, muted = false, lastTime = 0, audio;
            let paddle, ball, ballShadow, paddleX = 0, ballX = 0, ballY = -4.05, velocityX = 0, velocityY = 0;
            const paddleY = -4.55, paddleWidth = 2.55, ballRadius = .22;
            bestEl.textContent = String(best).padStart(4, '0');

            function material(color, roughness = .35, emissive = 0x000000, intensity = 0) {
                return new THREE.MeshStandardMaterial({ color, roughness, metalness: .14, emissive, emissiveIntensity: intensity });
            }
            function addBox(parent, x, y, z, w, h, d, mat, bevel = false) {
                const geometry = bevel ? new THREE.BoxGeometry(w, h, d, 1, 1, 1) : new THREE.BoxGeometry(w, h, d);
                const mesh = new THREE.Mesh(geometry, mat);
                mesh.position.set(x, y, z);
                mesh.castShadow = true;
                mesh.receiveShadow = true;
                parent.add(mesh);
                return mesh;
            }
            function makeArena() {
                const backing = new THREE.Mesh(new THREE.PlaneGeometry(16.2, 11), material(0x1c2b28, .72));
                backing.position.z = -1.4;
                scene.add(backing);
                const floorGrid = new THREE.GridHelper(16, 16, 0x41655a, 0x2d4841);
                floorGrid.rotation.x = Math.PI / 2;
                floorGrid.position.set(0, 0, -1.25);
                floorGrid.material.transparent = true;
                floorGrid.material.opacity = .2;
                scene.add(floorGrid);
                const railMat = material(0x34483e, .3, 0x1c422c, .4);
                addBox(scene, leftWall - .2, -.05, -.25, .26, 10.5, .44, railMat);
                addBox(scene, rightWall + .2, -.05, -.25, .26, 10.5, .44, railMat);
                addBox(scene, 0, topWall + .14, -.25, 15.8, .28, .44, railMat);
                const edgeMat = new THREE.MeshBasicMaterial({ color: 0x87c779 });
                for (const [x, y, w, h] of [[leftWall - .2, -.05, .025, 10.5], [rightWall + .2, -.05, .025, 10.5], [0, topWall + .14, 15.8, .025]]) {
                    const glow = new THREE.Mesh(new THREE.PlaneGeometry(w, h), edgeMat);
                    glow.position.set(x, y, .02);
                    scene.add(glow);
                }
                const moteGeometry = new THREE.SphereGeometry(.018, 5, 5);
                const moteMat = new THREE.MeshBasicMaterial({ color: 0xc6f6a1, transparent: true, opacity: .52 });
                for (let i = 0; i < 42; i++) {
                    const mote = new THREE.Mesh(moteGeometry, moteMat);
                    mote.position.set((Math.random() - .5) * 15.5, (Math.random() - .5) * 10.2, -0.9 + Math.random() * .5);
                    mote.userData.phase = Math.random() * Math.PI * 2;
                    scene.add(mote);
                    stars.push(mote);
                }
            }
            function makePaddleAndBall() {
                paddle = new THREE.Group();
                const body = addBox(paddle, 0, 0, 0, paddleWidth, .34, .5, material(0xd6ff48, .24, 0x83b51b, .48));
                const stripe = new THREE.Mesh(new THREE.BoxGeometry(paddleWidth * .66, .045, .04), new THREE.MeshBasicMaterial({ color: 0xf5ffb7 }));
                stripe.position.set(0, .115, .27);
                paddle.add(stripe);
                const padGlow = new THREE.PointLight(0xd6ff48, 5, 3.4);
                padGlow.position.set(0, .35, 1);
                paddle.add(padGlow);
                paddle.position.set(0, paddleY, .55);
                scene.add(paddle);
                const ballGroup = new THREE.Group();
                const sphere = new THREE.Mesh(new THREE.SphereGeometry(ballRadius, 24, 16), material(0xfff5ce, .12, 0xffb32b, 1.2));
                sphere.castShadow = true;
                ballGroup.add(sphere);
                const ballLamp = new THREE.PointLight(0xffc34a, 4.5, 2.4);
                ballGroup.add(ballLamp);
                ball = ballGroup;
                ball.position.set(0, ballY, .95);
                scene.add(ball);
                ballShadow = new THREE.Mesh(new THREE.CircleGeometry(.34, 24), new THREE.MeshBasicMaterial({ color: 0x080d0b, transparent: true, opacity: .38 }));
                ballShadow.position.set(0, ballY - .14, .12);
                scene.add(ballShadow);
            }
            const palette = [
                { color: 0xff705c, points: 50 }, { color: 0xffbd4a, points: 40 },
                { color: 0xd6ff48, points: 30 }, { color: 0x52e6dc, points: 20 },
                { color: 0xff62ae, points: 10 }
            ];
            function clearBricks() {
                for (const brick of bricks) scene.remove(brick.mesh);
                bricks.length = 0;
            }
            function buildBricks() {
                clearBricks();
                const columns = 9, rows = Math.min(5, 4 + Math.floor((level - 1) / 2));
                const width = 1.53, height = .47, gapX = .19, gapY = .18;
                const startX = -((columns * width + (columns - 1) * gapX) / 2) + width / 2;
                const colors = [0xff705c, 0xffbd4a, 0xd6ff48, 0x52e6dc, 0xff62ae];
                for (let row = 0; row < rows; row++) {
                    for (let column = 0; column < columns; column++) {
                        const color = colors[(row + Math.floor(column / 3)) % colors.length];
                        const mat = material(color, .27, color, .35);
                        const x = startX + column * (width + gapX);
                        const y = 4.05 - row * (height + gapY);
                        const mesh = addBox(scene, x, y, .25, width, height, .62, mat, true);
                        const cap = new THREE.Mesh(new THREE.BoxGeometry(width * .82, .035, .04), new THREE.MeshBasicMaterial({ color: 0xffffff, transparent: true, opacity: .56 }));
                        cap.position.set(0, height * .31, .33);
                        mesh.add(cap);
                        bricks.push({ mesh, x, y, w: width, h: height, points: palette[row % palette.length].points, color });
                    }
                }
            }
            function resetBall() {
                launched = false;
                ballX = paddleX;
                ballY = paddleY + .53;
                velocityX = velocityY = 0;
                ball.position.set(ballX, ballY, .95);
                ballShadow.position.set(ballX, ballY - .14, .12);
                stateEl.textContent = '按空白鍵或點擊發球';
            }
            function sound(frequency, duration = .08, type = 'triangle', volume = .035) {
                if (muted) return;
                try {
                    audio ||= new (window.AudioContext || window.webkitAudioContext)();
                    if (audio.state === 'suspended') audio.resume();
                    const osc = audio.createOscillator(), gain = audio.createGain();
                    osc.type = type;
                    osc.frequency.setValueAtTime(frequency, audio.currentTime);
                    osc.frequency.exponentialRampToValueAtTime(Math.max(35, frequency * .55), audio.currentTime + duration);
                    gain.gain.setValueAtTime(volume, audio.currentTime);
                    gain.gain.exponentialRampToValueAtTime(.001, audio.currentTime + duration);
                    osc.connect(gain); gain.connect(audio.destination); osc.start(); osc.stop(audio.currentTime + duration);
                } catch (_) {}
            }
            function updateScore(amount) {
                score += amount;
                scoreEl.textContent = String(score).padStart(4, '0');
                if (score > best) {
                    best = score;
                    bestEl.textContent = String(best).padStart(4, '0');
                    localStorage.setItem('a7-breaker-best', String(best));
                }
            }
            function burst(x, y, color) {
                const mat = new THREE.MeshBasicMaterial({ color, transparent: true });
                for (let i = 0; i < 7; i++) {
                    const piece = new THREE.Mesh(new THREE.BoxGeometry(.055, .055, .055), mat.clone());
                    piece.position.set(x, y, .55);
                    piece.userData.velocity.set((Math.random() - .5) * 5, (Math.random() - .35) * 5, (Math.random() - .5) * 2);
                    piece.userData.life = .42 + Math.random() * .3;
                    scene.add(piece);
                    particles.push(piece);
                }
            }
            function startGame() {
                score = 0; lives = 3; level = 1; paddleX = 0;
                scoreEl.textContent = '0000'; livesEl.textContent = '● ● ●'; levelEl.textContent = '01';
                buildBricks();
                paddle.position.x = 0;
                resetBall();
                running = true; paused = false;
                overlay.hidden = true;
                pauseButton.setAttribute('aria-label', '暫停');
                stateEl.textContent = '按空白鍵或點擊發球';
                lastTime = performance.now();
                requestAnimationFrame(frame);
            }
            function showOverlay(title, copy, buttonText) {
                document.querySelector('#overlay-title').textContent = title;
                document.querySelector('#overlay-copy').textContent = copy;
                startButton.querySelector('span').textContent = buttonText;
                overlay.hidden = false;
            }
            function endGame(won = false) {
                running = false;
                stateEl.textContent = won ? '清場完成' : '遊戲結束';
                showOverlay(won ? '全數擊破！' : '再來一局？', `最終分數 ${score} 分${won ? '，整片磚牆已清空。' : '，瞄準球拍再挑戰一次。'}`, '重新開始');
                sound(won ? 660 : 180, .35, won ? 'sine' : 'sawtooth', .05);
            }
            function launchBall() {
                if (!running) { startGame(); }
                if (paused || launched) return;
                launched = true;
                const direction = (Math.random() - .5) * .9;
                velocityX = direction * 4.1;
                velocityY = Math.sqrt(57 - velocityX * velocityX);
                stateEl.textContent = '全力開打';
                sound(480, .11, 'triangle');
            }
            function togglePause() {
                if (!running) return;
                paused = !paused;
                if (paused) {
                    stateEl.textContent = '已暫停';
                    pauseButton.setAttribute('aria-label', '繼續');
                    showOverlay('休息一下', '準備好再回來，霓虹磚牆還等著你。', '繼續遊戲');
                    startButton.querySelector('svg').innerHTML = '<path d="M8 5v14l11-7z"/>';
                } else {
                    overlay.hidden = true;
                    stateEl.textContent = launched ? '全力開打' : '按空白鍵或點擊發球';
                    pauseButton.setAttribute('aria-label', '暫停');
                    lastTime = performance.now();
                    requestAnimationFrame(frame);
                }
            }
            function updatePaddle(dt) {
                if (keys.ArrowLeft || keys.a || keys.A) paddleX -= 10.5 * dt;
                if (keys.ArrowRight || keys.d || keys.D) paddleX += 10.5 * dt;
                paddleX = THREE.MathUtils.clamp(paddleX, leftWall + paddleWidth / 2, rightWall - paddleWidth / 2);
                paddle.position.x += (paddleX - paddle.position.x) * Math.min(1, dt * 22);
                if (!launched) {
                    ballX = paddleX;
                    ballY = paddleY + .53;
                }
            }
            function updateBall(dt) {
                if (!launched) return;
                ballX += velocityX * dt;
                ballY += velocityY * dt;
                if (ballX < leftWall + ballRadius) { ballX = leftWall + ballRadius; velocityX = Math.abs(velocityX); sound(250, .04); }
                if (ballX > rightWall - ballRadius) { ballX = rightWall - ballRadius; velocityX = -Math.abs(velocityX); sound(250, .04); }
                if (ballY > topWall - ballRadius) { ballY = topWall - ballRadius; velocityY = -Math.abs(velocityY); sound(280, .04); }
                if (velocityY < 0 && ballY - ballRadius < paddleY + .2 && ballY > paddleY - .18 && Math.abs(ballX - paddleX) < paddleWidth / 2 + ballRadius) {
                    const offset = THREE.MathUtils.clamp((ballX - paddleX) / (paddleWidth / 2), -1, 1);
                    const speed = Math.min(10.8, Math.hypot(velocityX, velocityY) + .14);
                    velocityX = offset * speed * .84;
                    velocityY = Math.sqrt(speed * speed - velocityX * velocityX);
                    ballY = paddleY + .23;
                    sound(390, .06);
                }
                for (let i = bricks.length - 1; i >= 0; i--) {
                    const brick = bricks[i];
                    if (Math.abs(ballX - brick.x) < brick.w / 2 + ballRadius && Math.abs(ballY - brick.y) < brick.h / 2 + ballRadius) {
                        const overlapX = brick.w / 2 + ballRadius - Math.abs(ballX - brick.x);
                        const overlapY = brick.h / 2 + ballRadius - Math.abs(ballY - brick.y);
                        if (overlapX < overlapY) velocityX *= -1;
                        else velocityY *= -1;
                        burst(brick.x, brick.y, brick.color);
                        scene.remove(brick.mesh);
                        bricks.splice(i, 1);
                        updateScore(brick.points);
                        sound(520 + brick.points * 4, .12, 'square', .025);
                        break;
                    }
                }
                if (ballY < bottomEdge - .1) {
                    lives--;
                    livesEl.textContent = lives > 0 ? '● '.repeat(lives).trim() : '—';
                    sound(130, .22, 'sawtooth', .05);
                    if (lives <= 0) { endGame(); return; }
                    resetBall();
                }
                ball.position.set(ballX, ballY, .95);
                ballShadow.position.set(ballX, ballY - .14, .12);
                if (bricks.length === 0) {
                    level++;
                    levelEl.textContent = String(level).padStart(2, '0');
                    buildBricks();
                    resetBall();
                    sound(760, .24, 'sine', .05);
                }
            }
            function resize() {
                const width = canvas.clientWidth, height = canvas.clientHeight;
                if (!width || !height) return;
                renderer.setSize(width, height, false);
                const halfHeight = 5.375;
                const halfWidth = halfHeight * width / height;
                camera.left = -halfWidth; camera.right = halfWidth;
                camera.top = halfHeight; camera.bottom = -halfHeight;
                camera.updateProjectionMatrix();
            }
            function frame(now) {
                if (!running || paused) return;
                const dt = Math.min((now - lastTime) / 1000, .035);
                lastTime = now;
                updatePaddle(dt);
                updateBall(dt);
                const elapsed = now * .001;
                for (const star of stars) star.material.opacity = .3 + (Math.sin(elapsed * 1.7 + star.userData.phase) + 1) * .17;
                ball.rotation.y += dt * 2.4;
                ball.rotation.x += dt * 1.5;
                for (let i = particles.length - 1; i >= 0; i--) {
                    const particle = particles[i];
                    particle.userData.life -= dt;
                    particle.position.addScaledVector(particle.userData.velocity, dt);
                    particle.userData.velocity.y -= 6 * dt;
                    particle.material.opacity = Math.max(0, particle.userData.life);
                    particle.scale.multiplyScalar(Math.max(.92, 1 - dt * .5));
                    if (particle.userData.life <= 0) { scene.remove(particle); particles.splice(i, 1); }
                }
                renderer.render(scene, camera);
                if (running && !paused) requestAnimationFrame(frame);
            }
            function moveToPointer(event) {
                const rect = canvas.getBoundingClientRect();
                const halfWidth = camera.right;
                const normalized = (event.clientX - rect.left) / rect.width;
                paddleX = THREE.MathUtils.clamp((normalized * 2 - 1) * halfWidth, leftWall + paddleWidth / 2, rightWall - paddleWidth / 2);
                if (!running) { startGame(); }
                if (!paused && !launched && event.type === 'pointerdown') launchBall();
            }
            canvas.addEventListener('pointermove', event => { if (event.pointerType === 'mouse' || event.buttons) moveToPointer(event); });
            canvas.addEventListener('pointerdown', event => { canvas.setPointerCapture(event.pointerId); moveToPointer(event); });
            canvas.addEventListener('contextmenu', event => event.preventDefault());
            window.addEventListener('keydown', event => {
                if (['ArrowLeft', 'ArrowRight', ' '].includes(event.key)) event.preventDefault();
                keys[event.key] = true;
                if (event.code === 'Space' && !event.repeat) {
                    if (paused) togglePause(); else launchBall();
                }
                if (event.key === 'Escape' && running) togglePause();
            });
            window.addEventListener('keyup', event => { keys[event.key] = false; });
            startButton.addEventListener('click', () => {
                if (paused) { togglePause(); return; }
                if (!running) startGame();
                launchBall();
            });
            document.querySelector('#restart').addEventListener('click', startGame);
            pauseButton.addEventListener('click', togglePause);
            document.querySelector('#sound').addEventListener('click', event => {
                muted = !muted;
                event.currentTarget.style.color = muted ? '#ff705c' : '';
                event.currentTarget.setAttribute('aria-label', muted ? '開啟音效' : '關閉音效');
                if (!muted) sound(520);
            });
            document.querySelector('#launch').addEventListener('click', launchBall);
            for (const [id, key] of [['left', 'ArrowLeft'], ['right', 'ArrowRight']]) {
                const button = document.querySelector(`#${id}`);
                button.addEventListener('pointerdown', event => { event.preventDefault(); keys[key] = true; button.setPointerCapture(event.pointerId); });
                for (const endEvent of ['pointerup', 'pointercancel', 'lostpointercapture']) button.addEventListener(endEvent, () => { keys[key] = false; });
            }
            makeArena();
            makePaddleAndBall();
            buildBricks();
            resize();
            renderer.render(scene, camera);
            new ResizeObserver(resize).observe(canvas);
        })();
    </script>
</body>
